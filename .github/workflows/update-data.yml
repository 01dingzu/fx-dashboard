name: Update data

on:
  schedule:
    # 每日 01:30 UTC (北京时间 09:30)，此时美/欧/亚市场前一交易日数据均已就绪
    - cron: '30 1 * * *'
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update data files
        run: node scripts/update-data.mjs

      - name: Sanity check data files
        # 记录数异常偏少（<50）说明某个源退化了。故意不加 continue-on-error：
        # 让任务变红以便在 GitHub 上被看到；但下面的提交步骤是 if: always()，
        # 已成功的数据仍会提交，不会因为一个源出问题而全看板断更。
        run: node scripts/data-stats.mjs

      - name: Commit and push if changed
        if: always() # 更新脚本部分失败也要提交已成功的源，避免全看板断更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新 $(date -u +'%Y-%m-%d')"
            git push
          fi
